name: Krypto-Radar

# Täglich nach dem Tagesschluss: Kurse aller Binance-Coins laden, Strategie und Muster auswerten,
# Benachrichtigungen über ntfy senden und die App mit den neuen Daten veröffentlichen.
on:
  schedule:
    - cron: "5 7 * * *"   # 07:05 UTC = 9:05 Uhr Sommerzeit, 8:05 Uhr Winterzeit
  workflow_dispatch:      # von Hand starten: Actions → Krypto-Radar → Run workflow
  push:
    branches: [main]

permissions:
  contents: write   # Verlauf der Meldungen speichern
  pages: write      # App veröffentlichen
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kursdaten aus dem Zwischenspeicher
        uses: actions/cache@v6
        with:
          path: kursdaten
          key: kursdaten-${{ github.run_id }}
          restore-keys: kursdaten-

      - name: Auswertung und Benachrichtigungen
        env:
          RADAR_DATA: kursdaten
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p web/daten verlauf
          if [ -f verlauf/signale.json ]; then cp verlauf/signale.json web/daten/; fi
          python -m radar.scan
          cp web/daten/signale.json verlauf/signale.json

      - name: Verlauf der Meldungen speichern
        run: |
          git config user.name "krypto-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verlauf/signale.json
          if ! git diff --cached --quiet; then
            git commit -m "Meldungen $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v5
